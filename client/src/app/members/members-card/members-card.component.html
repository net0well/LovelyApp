<div class="card mb-4" style="border-radius: 18px; overflow: hidden; border: 2px solid #BEF8FF; box-shadow: 0 8px 20px rgba(190, 248, 255, 0.5); transition: all 0.3s ease;">
  <div class="card-img-wrapper" style="position: relative; overflow: hidden;">
    <img src="{{member().photoUrl}}" alt="{{member().knownAs}}" class="card-img-top" style="transition: transform 0.5s ease;">
    <div class="image-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(255, 75, 145, 0.3), transparent 70%); opacity: 0; transition: opacity 0.3s ease;"></div>

    <div class="floating-hearts" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 0.3s ease;">
      <div style="position: absolute; top: 10%; left: 15%; font-size: 1.2rem;">❤️</div>
      <div style="position: absolute; top: 25%; right: 20%; font-size: 1rem;">💕</div>
      <div style="position: absolute; bottom: 30%; left: 25%; font-size: 1.1rem;">💘</div>
    </div>
  </div>

  <div class="card-body p-3" style="background: linear-gradient(to bottom right, white, #FBFBFF);">
    <h6 class="card-title text-center mb-2" style="font-weight: 600; color: #FF4B91; font-size: 1.1rem;">
      <i class="fa fa-user me-2"></i>
      {{member().knownAs}}
      <span style="font-size: 0.9rem; margin-left: 2px;">✨</span>
    </h6>
    <p class="card-text text-center mb-3" style="color: #777; font-size: 0.9rem;">
      <i class="fa fa-map-marker me-1" style="color: #FF4B91;"></i>
      {{member().city}}
    </p>

    <ul class="list-inline text-center mb-0">
      <li class="list-inline-item" style="margin: 0 3px;">
        <button routerLink="/members/{{member().userName}}" class="btn btn-primary" style="background-color: #FF4B91; color: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 3px 10px rgba(255, 75, 145, 0.3); transition: all 0.2s ease;">
          <i class="fa fa-user" style="font-size: 0.9rem;"></i>
        </button>
      </li>
      <li class="list-inline-item" style="margin: 0 3px;">
        <button class="btn btn-primary" style="background-color: #FF4B91; color: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 3px 10px rgba(255, 75, 145, 0.3); transition: all 0.2s ease;">
          <i class="fa fa-heart" style="font-size: 0.9rem;"></i>
        </button>
      </li>
      <li class="list-inline-item" style="margin: 0 3px;">
        <button class="btn btn-primary" style="background-color: #FF4B91; color: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 3px 10px rgba(255, 75, 145, 0.3); transition: all 0.2s ease;">
          <i class="fa fa-envelope" style="font-size: 0.9rem;"></i>
        </button>
      </li>
    </ul>
  </div>
</div>
