<div class="modal-content">
  <div class="modal-title">
    <h2>Alterações não salvas</h2>
  </div>

  <div class="modal-body">
    <p>{{ data.message }}</p>
  </div>

  <div class="modal-actions">
    <button class="btn-cancel" (click)="onNoClick()">
      Cancelar
    </button>
    <button class="btn-confirm" (click)="onYesClick()">
      Sim, prosseguir
    </button>
  </div>
</div>
