<!-- not-found.component.html - Versão melhorada com animações e interatividade -->
<div class="not-found-container">
  <div class="content-box">
    <!-- Coração quebrado animado -->
    <div class="heart-broken">
      <svg width="120" height="120" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="pulse-heart">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              fill="#FF4B91" stroke="none" />
        <path d="M6 12L18 6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" class="crack-line" />
      </svg>
    </div>

    <!-- Código de erro animado -->
    <div class="error-code-container">
      <h1 class="title">4</h1>
      <div class="spinner-container">
        <svg class="spinner" viewBox="0 0 50 50">
          <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
        </svg>
      </div>
      <h1 class="title">4</h1>
    </div>

    <h2 class="subtitle">Página Não Encontrada</h2>

    <!-- Mensagem com animação de digitação -->
    <p class="message typewriter">Ops! Esta página não foi encontrada ou não está mais disponível.</p>

    <p class="submessage">Tente por outro lado!</p>

    <!-- Botão animado para voltar à página inicial -->
    <button routerLink="/" class="return-button">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-house-heart me-2 bounce-icon" viewBox="0 0 16 16">
        <path d="M8 6.982C9.664 5.309 13.825 8.236 8 12 2.175 8.236 6.336 5.309 8 6.982Z"/>
        <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.707L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.646a.5.5 0 0 0 .708-.707L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5ZM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5 5 5Z"/>
      </svg>
      <span>Voltar à Página Inicial</span>
    </button>

    <!-- Easter egg interativo escondido -->
    <div class="easter-egg" (click)="triggerEasterEgg()">
      <span class="easter-egg-text">Você encontrou um easter egg!</span>
      <div class="hearts-container"></div>
    </div>
  </div>
</div>
