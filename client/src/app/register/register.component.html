<div class="register-container" style="max-width: 400px; margin: 40px auto; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(255, 75, 145, 0.12); background: linear-gradient(to bottom right, white, #FEFEFF); border: 1px solid rgba(190, 248, 255, 0.3);">
  <form [formGroup]="registerForm" (ngSubmit)="register()">
  <div class="text-center mb-3">
      <div style="background-color: rgba(255, 75, 145, 0.1); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                fill="#FF4B91" stroke="none" />
        </svg>
      </div>
      <h2 style="font-weight: 600; color: #FF4B91; letter-spacing: 0.5px; font-size: 1.6rem; margin-bottom: 8px;">Crie sua conta</h2>
      <p style="color: #777; font-size: 0.9rem; margin-bottom: 20px;">Estamos animados para te ajudar a encontrar seu par perfeito</p>
    </div>

    <div class="mb-3">
      <label style="font-weight: 500; font-size: 0.9rem; color: #555; margin-bottom: 6px; display: block;">Nome de usuário</label>
      <div class="input-group" style="border-radius: 15px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid rgba(190, 248, 255, 0.6);">
        <span class="input-group-text" style="background-color: #BEF8FF; border: none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#FF4B91" class="bi bi-person" viewBox="0 0 16 16">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664z"/>
          </svg>
        </span>
        <input type="text" class="form-control" name="username" formControlName="username" placeholder="Escolha um nome de usuário"
               style="border: none; padding: 10px 15px; font-size: 0.95rem;">
      </div>
    </div>

    <div class="mb-3">
      <label style="font-weight: 500; font-size: 0.9rem; color: #555; margin-bottom: 6px; display: block;">Senha</label>
      <div class="input-group" style="border-radius: 15px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid rgba(190, 248, 255, 0.6);">
        <span class="input-group-text" style="background-color: #BEF8FF; border: none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#FF4B91" class="bi bi-lock" viewBox="0 0 16 16">
            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2M5 8h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1"/>
          </svg>
        </span>
        <input type="password" class="form-control" name="password" formControlName="password" placeholder="Crie uma senha segura"
               style="border: none; padding: 10px 15px; font-size: 0.95rem;">
      </div>
    </div>

    <div class="mb-3">
      <label style="font-weight: 500; font-size: 0.9rem; color: #555; margin-bottom: 6px; display: block;">Confirmar senha</label>
      <div class="input-group" style="border-radius: 15px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid rgba(190, 248, 255, 0.6);">
        <span class="input-group-text" style="background-color: #BEF8FF; border: none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#FF4B91" class="bi bi-lock" viewBox="0 0 16 16">
            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2M5 8h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1"/>
          </svg>
        </span>
        <input type="password" class="form-control" name="confirmPassword" formControlName="confirmPassword" placeholder="Confirme sua senha"
               style="border: none; padding: 10px 15px; font-size: 0.95rem;">
      </div>
    </div>

    <div class="mt-4 d-flex justify-content-between">
      <button class="btn" (click)="cancel()" type="button"
              style="border-radius: 15px; font-weight: 500; padding: 9px 0; background-color: transparent; color: #FF4B91; border: 1px solid rgba(255, 75, 145, 0.3); width: 48%; transition: all 0.2s ease;">
        Voltar
      </button>
      <button class="btn" type="submit"
              style="border-radius: 15px; font-weight: 500; padding: 9px 0; background: linear-gradient(135deg, #FF4B91, #FF78AB); color: white; border: none; width: 48%; box-shadow: 0 3px 10px rgba(255, 75, 145, 0.2); transition: all 0.2s ease;">
        Registrar-se
      </button>
    </div>

    <div class="text-center mt-4">
      <div style="background-color: rgba(190, 248, 255, 0.3); height: 1px; margin-bottom: 15px;"></div>
      <p style="color: #777; font-size: 0.8rem; line-height: 1.4;">
        Ao se registrar, você concorda com nossos
        <a href="#" style="color: #FF4B91; text-decoration: none; font-weight: 500;">Termos</a> e
        <a href="#" style="color: #FF4B91; text-decoration: none; font-weight: 500;">Política de Privacidade</a>
      </p>
    </div>
  </form>
</div>

<p>Form value: {{registerForm.value | json}}</p>
<p>Form status: {{registerForm.status | json}}</p>
