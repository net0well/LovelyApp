<div class="register-container" style="max-width: 400px; margin: 40px auto; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(255, 75, 145, 0.12); background: linear-gradient(to bottom right, white, #FEFEFF); border: 1px solid rgba(190, 248, 255, 0.3);">
  <form [formGroup]="registerForm" (ngSubmit)="register()">
  <div class="text-center mb-3">
      <div style="background-color: rgba(255, 75, 145, 0.1); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                fill="#FF4B91" stroke="none" />
        </svg>
      </div>
      <h2 style="font-weight: 600; color: #FF4B91; letter-spacing: 0.5px; font-size: 1.6rem; margin-bottom: 8px;">Crie sua conta</h2>
      <p style="color: #777; font-size: 0.9rem; margin-bottom: 20px;">Estamos animados para te ajudar a encontrar seu par perfeito</p>
    </div>

    <app-text-input [formControl]="$any(registerForm.controls['username'])"
                    [label]="'Usuario'"
    ></app-text-input>

    <app-text-input [formControl]="$any(registerForm.controls['password'])"
                    [label]="'Senha'" [type]="'password'"
    ></app-text-input>

    <app-text-input [formControl]="$any(registerForm.controls['confirmPassword'])"
                    [label]="'Confirme a senha'" [type]="'password'"
    ></app-text-input>


    <div class="mt-4 d-flex justify-content-between">
      <button class="btn" (click)="cancel()" type="button"
              style="border-radius: 15px; font-weight: 500; padding: 9px 0; background-color: transparent; color: #FF4B91; border: 1px solid rgba(255, 75, 145, 0.3); width: 48%; transition: all 0.2s ease;">
        Voltar
      </button>
      <button class="btn" type="submit"
              style="border-radius: 15px; font-weight: 500; padding: 9px 0; background: linear-gradient(135deg, #FF4B91, #FF78AB); color: white; border: none; width: 48%; box-shadow: 0 3px 10px rgba(255, 75, 145, 0.2); transition: all 0.2s ease;">
        Registrar-se
      </button>
    </div>

    <div class="text-center mt-4">
      <div style="background-color: rgba(190, 248, 255, 0.3); height: 1px; margin-bottom: 15px;"></div>
      <p style="color: #777; font-size: 0.8rem; line-height: 1.4;">
        Ao se registrar, você concorda com nossos
        <a href="#" style="color: #FF4B91; text-decoration: none; font-weight: 500;">Termos</a> e
        <a href="#" style="color: #FF4B91; text-decoration: none; font-weight: 500;">Política de Privacidade</a>
      </p>
    </div>
  </form>
</div>

<p>Form value: {{registerForm.value | json}}</p>
<p>Form status: {{registerForm.status | json}}</p>
